# Centauri Carbon 1 with the CANVAS toolhead kit.

# COSMOS's config for the kit's toolhead board: the thermistor
# pulldown_resistor (without it COSMOS e-stops with "Fire hazard detected"),
# the front cover sensor, CLEAN_NOZZLE and the KICK end position.
[include /etc/klipper/config/extras-readonly/canvas-toolhead.cfg]

# The frame sensor is out of the filament path.
[!filament_switch_sensor filament_sensor]

[AFC_extruder extruder]
pin_tool_start: !hotend:PB2
