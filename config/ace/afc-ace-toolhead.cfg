# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro — toolhead sensor path (Centauri Carbon 1 and 2)
#
# The ACE's tubes go into a filament merger on the toolhead, with a sensor
# before the extruder gears (the CANVAS toolhead: a kit on the CC1, stock on
# the CC2). The CANVAS unit itself is not used, so elegoo_canvas stays False
# in cosmos.conf. The frame runout sensor is out of the filament path.
# cc1-head.cfg / cc2-head.cfg hold the machine's sensor pin and board specifics.
#
# A load parks over the tray and feeds to the toolhead sensor cold, before
# the hotend heat-up; the rest waits for temperature. The last
# sensor_approach_mm run at sensor_approach_speed so the stop cannot carry the
# tip into the gears. The ACE pushes sync_load_mm with the extruder turning,
# the extruder pulls the rest of tool_stn with feed assist on.
#
# EXPERIMENTAL. See README.md.
# ─────────────────────────────────────────────────────────────────────────────

# COSMOS's PAUSE/RESUME read the toolhead sensor instead (as COSMOS's
# canvas.cfg does).
[gcode_macro _global_var]
variable_runout_sensor_name: 'filament_switch_sensor extruder_tool_start'

# ── Unit ─────────────────────────────────────────────────────────────────────
[AFC_ACE]
hub_clear_mm: 65          # park behind the sensor: COSMOS's CANVAS park
sensor_approach_mm: 30
sensor_approach_speed: 15
sync_load_mm: 8
# dist_hub (all lanes) is slot -> merger. It only speeds up the first load of a fresh
# spool (tip at the slot): fast for dist_hub minus the slow parts, then slowly
# until the sensor finds the filament. Must NOT be longer than the real tube:
# err short, the rest just runs slowly.
# Per lane: [AFC_lane laneN] dist_hub: ... in printer.cfg.
dist_hub: 500

# ── Hub ──────────────────────────────────────────────────────────────────────
# COSMOS's canvas.cfg values for the same head; afc_bowden_length is merge
# point -> sensor. An unload unwinds until the sensor clears, then parks
# hub_clear_mm behind it; the unwind is capped at afc_unload_bowden_length +
# tool_stn + hub_clear_mm, never running on toward the slot.
[AFC_hub ACE_1]
afc_bowden_length: 8
afc_unload_bowden_length: 45

# ── Toolhead ─────────────────────────────────────────────────────────────────
# tool_stn is sensor -> nozzle: COSMOS moves a CANVAS lane afc_bowden_length
# (8) with the extruder turning, then tool_stn (43.5) with the extruder alone,
# 51.5 in all.
#
# enable_tool_runout is off: when a spool runs out, the driver's endless-spool
# swap fires as the tail passes this sensor, and AFC's own toolhead runout
# would pause at the same moment. A broken filament (spool still in its slot,
# sensor empty) is caught by the driver, which raises AFC's break/jam pause.
[AFC_extruder extruder]
tool_stn: 51.5
enable_tool_runout: False
