# ─────────────────────────────────────────────────────────────────────────────
# AFC + Anycubic ACE Pro on COSMOS — shared hardware config
#
# Not included directly: one of the cc1-/cc2- entry files includes this, then
# the sensor path and machine pieces. Change values from printer.cfg, below
# the afc-ace include, e.g.
#
#   [AFC_ACE]
#   dist_hub: 700
#
# EXPERIMENTAL. See README.md.
# ─────────────────────────────────────────────────────────────────────────────

# ── The ACEs ────────────────────────────────────────────────────────────────
# One section for all units. ace: pro (ACE Pro) or 2pro (ACE 2 Pro, untested
# on hardware). units: auto counts the ACEs attached when Klipper starts and
# makes a unit with four lanes for each: ACE_1 = lane1-4 (T0-T3), ACE_2 =
# lane5-8 (T4-T7), ... Or a number, to keep that many whatever is plugged in.
# Every other key here is a default for all units; the sensor-path file adds
# its own. To change one unit only: [AFC_ACE ACE_2] in printer.cfg, one lane
# only: [AFC_lane lane5] (no unit line).
[AFC_ACE]
ace: pro
units: auto
hub: ACE_1
extruder: extruder
feed_speed: 50
retract_speed: 75
purge_park_cmd: _AFC_ACE_PURGE_SPOT   # COSMOS's PURGE position, off the v-slot

# ── Hub ──────────────────────────────────────────────────────────────────────
# The ACE has no hub switch: the hub is virtual, its state derived from the
# lanes. Lengths are set by the sensor-path file.
[AFC_hub ACE_1]
switch_pin: virtual
enable_hub_runout: False

# ── Toolhead ─────────────────────────────────────────────────────────────────
[AFC_extruder extruder]
tool_stn_unload: 32              # pull out of the gears after the cut
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8

# Room for the longest extrude-only move a load makes.
[extruder]
max_extrude_only_distance: 1000

# ── AFC itself ───────────────────────────────────────────────────────────────
# On top of COSMOS's extras-readonly/afc.cfg [AFC]; only what the ACE needs
# differently, plus the LED colours AFC's panels show.
[AFC]
load_to_hub: False
homing_enabled: False           # no lane steppers to home: the ACE feeds itself
enable_assist: False
enable_hub_runout: False
park_pre_load: False            # the driver parks before its feed to the sensor
kick_cmd: KICK
spool_ratio: 2
led_fault: 1,0,0,0
led_ready: 0,0,0,0.5
led_not_ready: 1,0,0,0
led_loading: 0.2,0,0,0.5
led_tool_loaded: 1,0,0,1
led_buffer_advancing: 0,0,1,0
led_buffer_trailing: 0,1,0,0
led_buffer_disable: 0,0,0,0.25
led_spool_illuminate: 1,1,1,0
