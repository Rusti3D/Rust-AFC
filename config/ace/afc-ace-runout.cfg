# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro — frame runout sensor path (Centauri Carbon 1 and 2)
#
# The ACE feeds through a hub adapter on the printer's own filament runout
# sensor; the toolhead has no sensor before the gears. The frame sensor homes
# every feed, then afc_bowden_length is a blind push to just short of the
# gears, and tool_stn closes the gap with the ACE and extruder pushing
# together. The purge pulls the filament on to the nozzle.
#
# EXPERIMENTAL. See README.md.
# ─────────────────────────────────────────────────────────────────────────────

# ── Frame sensor ─────────────────────────────────────────────────────────────
# It becomes AFC's hub sensor, read by name. switch_pin is deliberately not
# restated: it comes from COSMOS's machine.cfg (PC0 on the CC1, the serial
# filament_sensor board on the CC2). Its stock runout gcode has to go, or it
# fights AFC for the same event; the other behaviour keys are restated so
# nothing leaks in from the stock section. On the CC2 the stock encoder
# (filament_motion_sensor) stays: it pauses on a jam, filament present but
# not moving.
[filament_switch_sensor filament_sensor]
pause_on_runout: False
event_delay: 0.2
debounce_delay: 0.02
smart: True
runout_distance: 0
runout_gcode:
insert_gcode:
immediate_runout_gcode:

# COSMOS's RESUME refuses while this sensor is enabled and empty, and with an
# ACE it is empty between toolchange stages. Disable the gate; AFC and the
# driver still read the live state. In bypass (AFC_ACE_BYPASS) the driver
# turns it back on with COSMOS's stock runout pause, so leave it then.
[delayed_gcode _afc_ace_mute_sensor_gates]
initial_duration: 2
gcode:
  {% if not printer.AFC.bypass_state %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}

# ── Unit ─────────────────────────────────────────────────────────────────────
[AFC_ACE]
hub_sensor_name: filament_sensor
hub_clear_mm: 110         # park past the sensor, clear of the splitter
# dist_hub (all lanes) is slot -> frame sensor. The sensor stops the feed, so it is only a
# cap: err generous.
# Per lane: [AFC_lane laneN] dist_hub: ... in printer.cfg.
dist_hub: 1200

# ── Hub ──────────────────────────────────────────────────────────────────────
# afc_bowden_length is the ONLY tuned number: the blind push from the frame
# sensor to just short of the extruder gears (815mm measured on a CC1, so 810).
# Too short and the gears never grab (dry purge, air on layer 1); too long and
# the ACE shoves filament into stopped gears. Measure yours (README), tune it
# live with SET_BOWDEN_LENGTH HUB=ACE_1 LENGTH=+10, and write the result into
# printer.cfg as an [AFC_hub ACE_1] override. Not yet measured on a CC2.
[AFC_hub ACE_1]
afc_bowden_length: 810

# ── Toolhead ─────────────────────────────────────────────────────────────────
# tool_stn: the gap left by afc_bowden_length plus a few mm, pushed by the ACE
# and extruder together to thread the gears.
[AFC_extruder extruder]
tool_stn: 5
