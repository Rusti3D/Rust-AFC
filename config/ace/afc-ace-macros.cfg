# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro on COSMOS — macros shared by the Centauri Carbon 1 and 2
#
# The pieces AFC calls out to. Purging, parking and the nozzle wipe are
# COSMOS's own (PURGE, MOVE_TO_TRAY, KICK, CLEAN_NOZZLE), with COSMOS's
# positions for each machine and toolhead; only the cutter is overridden, at
# COSMOS's cut position (X255, the same on both machines).
# ─────────────────────────────────────────────────────────────────────────────

# Double-press cut. A missed cut is expensive: the ACE retract then drags
# uncut filament back down the bowden, so it presses twice.
[gcode_macro CUT_FILAMENT]
variable_retract_length: 10
variable_pushback_length: 5
gcode:
  {% set self = printer["gcode_macro CUT_FILAMENT"] %}
  {% set retract_length = self.retract_length|float %}
  {% set pushback_length = self.pushback_length|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  M83
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    G1 E-{retract_length} F300
  {% endif %}
  G0 Y20 F12000
  G0 X255 F12000
  {% for _ in range(2) %}
    G0 Y4 F18000
    G0 Y20 F18000
  {% endfor %}
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    MOVE_TO_TRAY
    G1 E{pushback_length} F300
    G1 E-{pushback_length} F600
  {% endif %}
  M400

# Where a load extrudes ([AFC_ACE] purge_park_cmd): COSMOS's own purge spot.
# MOVE_TO_TRAY parks on the tray's v-slot line (Y264, where KICK sweeps X to
# clip the purge off); COSMOS's PURGE steps 1 mm back to Y265 before every
# extrusion, so the filament drops past the slot instead of piling on it.
# Same move on both machines: shared-macros.cfg's PURGE, from each machine's
# own MOVE_TO_TRAY X. EXTRUDER is accepted and ignored, as MOVE_TO_TRAY does.
[gcode_macro _AFC_ACE_PURGE_SPOT]
gcode:
    MOVE_TO_TRAY
    G90
    G1 Y265 F1200
    M400

# Slicer colour change. With T, change to that tool (L sets the purge,
# otherwise AFC's default applies). Without T it is a plain manual filament
# change, so pause — falling back to T0 would load the wrong colour.
[gcode_macro M600]
gcode:
    {% if 'T' in params %}
        T{params.T|int}{% if 'L' in params %} PURGE_LENGTH={params.L|float}{% endif %}
    {% else %}
        PAUSE
    {% endif %}

# COSMOS's stock unload, verbatim from its shared-macros.cfg. COSMOS's afc.cfg
# replaces it with TOOL_UNLOAD, and AFC renames whatever UNLOAD_FILAMENT is at
# startup and runs that in bypass: TOOL_UNLOAD calling itself, which Klipper
# rejects as recursive. Outside bypass UNLOAD_FILAMENT is still TOOL_UNLOAD.
[gcode_macro UNLOAD_FILAMENT]
gcode:
    _CG28 AXIS=XY
    CUT_FILAMENT
    MOVE_TO_TRAY
    COLD_EXTRUDE HEATER=extruder ENABLE=1
    G1 E-30 F600
    COLD_EXTRUDE HEATER=extruder ENABLE=0
    G0 Y250
    M400
    _SHOW_PROMPT TITLE="Unload completed" MESSAGE="Filament is safe to remove now"

# Feed a spool straight into the printer, bypassing the ACE and AFC: unloads
# the loaded lane, turns on AFC's virtual bypass, and gives the path sensor
# its runout pause back. Mainsail's virtual_bypass switch does the same,
# without the unload.
[gcode_macro AFC_ACE_BYPASS_ON]
description: Bypass the ACE: feed a spool directly
gcode:
    AFC_ACE_BYPASS ENABLE=1

[gcode_macro AFC_ACE_BYPASS_OFF]
description: Back to the ACE lanes (unload the bypass spool first)
gcode:
    AFC_ACE_BYPASS ENABLE=0
