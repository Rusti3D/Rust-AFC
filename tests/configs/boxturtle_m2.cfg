# boxturtle_flow.cfg with AFC's own accessories: tip forming on the tool
# unload (form_tip_cmd: AFC), AFC_poop's settings and a button for lane1 on
# the AFC-Lite's free switch input SW6
[include boxturtle_flow.cfg]

[AFC]
form_tip: True
form_tip_cmd: AFC

[AFC_form_tip]
ramming_volume: 0
toolchange_temp: 0
unloading_speed_start: 40
cooling_moves: 3

[AFC_poop]
purge_loc_xy: 10,190

[AFC_button lane1]
pin: ^Turtle_1:SW6
