# ace_offline.cfg with Moonraker (tools/fake_moonraker.py, so AFC has its stats
# and loads / unloads run to the end) and COSMOS's afc.cfg runout setting:
# unload_on_runout (a runout with no runout lane unloads, then pauses).
[include ace_offline.cfg]

[AFC]
moonraker_host: http://127.0.0.1
moonraker_port: 7199
unload_on_runout: True

# Holds the test's wall-clock time (RUN_SHELL_COMMAND CMD=hold PARAMS=<secs>)
# while the fake ACE's events happen, the g-code lock held as by any command
[gcode_shell_command hold]
command: sleep
timeout: 120
verbose: False
