# A two-tool toolchanger (AFC_Toolchanger) on the atmega2560 test machine: tool 0 is
# [extruder] with its toolhead sensor on PK1, tool 1 an [extruder1] on the AFC-Lite
# (Turtle_1, stm32h723) motor port M3 without a sensor (pin_tool_start: virtual).
# No unit feeds them: each tool is its own lane. klipper-toolchanger's SELECT_TOOL /
# UNSELECT_TOOL are macros here that switch the active extruder. AFC's state paths,
# Moonraker (tools/fake_moonraker.py) and 0 C materials as the other test configs.
# Made for the parity tests.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000
min_extrude_temp: 0

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[pause_resume]
[idle_timeout]
[virtual_sdcard]
path: /tmp/rust_afc_state

[mcu Turtle_1]
serial: /dev/serial/by-path/platform-4200000.usb-usb-0:1.3:1.0

[extruder1]
step_pin: Turtle_1:PE2
dir_pin: Turtle_1:PE3
enable_pin: !Turtle_1:PE0
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: Turtle_1:PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: Turtle_1:PB1
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000
min_extrude_temp: 0

[include cosmos/afc.cfg]

[gcode_macro _AFC_GLOBAL_VARS]
variable_stepper_name: 'lane'

[AFC]
VarFile: /tmp/rust_afc_state/AFC.var
moonraker_host: http://127.0.0.1
moonraker_port: 7199
default_material_temps: default:0, PLA:0, PETG:0

[AFC_Toolchanger Tools]

[AFC_extruder extruder]
toolchanger_unit: Tools
pin_tool_start: ^PK1

[AFC_extruder extruder1]
toolchanger_unit: Tools
pin_tool_start: virtual

[gcode_macro SELECT_TOOL]
gcode:
  {% set t = params.T|int %}
  ACTIVATE_EXTRUDER EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t}

[gcode_macro UNSELECT_TOOL]
gcode:
  G4 P0
