# An OpenAMS ([AFC_OpenAMS AMS_1] on the [AFC_OAMS oams1] controller) on the
# atmega2560 test machine, the OAMS board as [mcu oams] (tests/dicts/oams.dict,
# made by tools/make_oams_dict.py). Batch mode gets no OAMS messages: the
# cases deliver them with TEST_MCU_MSG. Made for the parity tests (no OpenAMS
# config ships with COSMOS); the controller values are an OpenAMS's usual ones.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000
min_extrude_temp: 0

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[mcu oams]
serial: /dev/serial/by-id/usb-OpenAMS_oams1

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[pause_resume]
[idle_timeout]
[virtual_sdcard]
path: /tmp/rust_afc_state

[gcode_macro _AFC_GLOBAL_VARS]
variable_disable_skew_correction: False
variable_verbose: 2
gcode:

[AFC_prep]
enable: True
delay_time: 0.5

[AFC]
VarFile: /tmp/rust_afc_state/AFC.var
moonraker_host: http://127.0.0.1
moonraker_port: 7199
default_material_temps: default:0, PLA:0, PETG:0
default_material_type: PLA
config_save_method: kalico
load_to_hub: False
homing_enabled: False
enable_assist: False
enable_hub_runout: False
park_pre_load: False
tool_cut: False
park: False
poop: False
kick: False
wipe: False

[AFC_OAMS oams1]
mcu: oams
fps_upper_threshold: 0.7
fps_lower_threshold: 0.3
fps_is_reversed: true
f1s_hes_on: 0.1, 0.1, 0.1, 0.1
f1s_hes_is_above: true
hub_hes_on: 0.85, 0.85, 0.85, 0.85
hub_hes_is_above: true
ptfe_length: 2087.5
oams_idx: 1

[AFC_OpenAMS AMS_1]
oams: oams1
extruder: extruder
hub: Hub_1

[AFC_hub Hub_1]
switch_pin: virtual
enable_hub_runout: False
afc_bowden_length: 900

[AFC_extruder extruder]
pin_tool_start: ^PK1
tool_stn: 53.5
tool_stn_unload: 42.0
tool_sensor_after_extruder: 0
tool_unload_speed: 25
tool_load_speed: 25
enable_tool_runout: False

[AFC_lane lane0]
unit: AMS_1:1
map: T0

[AFC_lane lane1]
unit: AMS_1:2
map: T1

[AFC_lane lane2]
unit: AMS_1:3
map: T2

[AFC_lane lane3]
unit: AMS_1:4
map: T3

[test_mcu_msg]
# the firmware's answer to the spool query: no spool loaded
answer: oams oams_cmd_query_spool -> oams_query_response_spool spool=255
