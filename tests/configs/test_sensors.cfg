# The parity runs' sensor control for a printer config: TEST_BUTTON
# (tests/plugins/test_button.py; natively in kaliru-afc) to change the lanes'
# sensors as the unit's board would report them, and what lets AFC react to
# them in batch mode (below)

[test_button]

# SET_KINEMATIC_POSITION in place of G28: homing in batch mode runs every axis
# its full length in print time, which an idle wait would have to sit out
[force_move]
enable_force_move: True

# PREP without lane movement ([AFC_prep] enable: its system_Test moves): in
# batch mode the toolhead never reports idle after a move (no MCU clock), and
# AFC acts on a sensor change only while idle_timeout says the printer is idle
[AFC_prep]
enable: False
