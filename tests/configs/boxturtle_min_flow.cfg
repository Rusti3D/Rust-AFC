# boxturtle_min_btn.cfg with the sensors following the filament: each homing
# move flips the sensor it homes to (test_button's follow_homing), as the
# filament reaches or leaves it on a printer. Loads and unloads then run
# their whole sensor-driven path.
[include boxturtle_min_btn.cfg]

[test_button]
follow_homing: True
