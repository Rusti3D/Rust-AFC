# COSMOS's BoxTurtle setup, its afc.cfg and boxturtle.cfg unchanged (cosmos/), on the
# atmega2560 test machine with the AFC-Lite as Turtle_1 (stm32h723). Overrides only
# what the harness needs: AFC's state paths and Moonraker (tools/fake_moonraker.py),
# the toolhead sensor pin (no hotend MCU here) and 0 C materials (batch mode has no
# temperatures, so loads must not wait for a heat-up).
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000
min_extrude_temp: 0

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[pause_resume]
[idle_timeout]
[virtual_sdcard]
path: /tmp/rust_afc_state

[include cosmos/boxturtle.cfg]

[AFC]
VarFile: /tmp/rust_afc_state/AFC.var
moonraker_host: http://127.0.0.1
moonraker_port: 7199
default_material_temps: default:0, PLA:0, PETG:0

[AFC_extruder extruder]
pin_tool_start: ^PK1
