# boxturtle_min_flow.cfg with an analog buffer (AFC_buffer type FPS_PSF, an
# OpenAMS FPS / PSF style sensor) on the AFC-Lite's ADC pin PC0, the unit's
# buffer. Batch mode gets no ADC reports: the reading stays 0, so the
# correction runs on that
[include boxturtle_min_flow.cfg]

[AFC_buffer FPS1]
type: FPS_PSF
adc_pin: Turtle_1:PC0
debug: True

[AFC_BoxTurtle Turtle_1]
buffer: FPS1
