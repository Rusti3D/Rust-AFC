# Centauri Carbon 2: the toolhead sensor is stock.

# The frame sensor board (and its encoder) is out of the filament path; the
# same three sections COSMOS's CC2 canvas.cfg removes.
[!canvas_filament_sensor]
[!filament_switch_sensor filament_sensor]
[!filament_motion_sensor filament_motion]

[AFC_extruder extruder]
pin_tool_start: !hotend:PB1
